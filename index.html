  <h1>🔒 合言葉を入力してください</h1>
  <input id="pw" type="password" placeholder="合言葉" autofocus onkeydown="if(event.key==='Enter')go()">
  <label style="display:block;margin-top:10px;font-size:13px;color:#5b6776;text-align:left">
    <input id="remember" type="checkbox" checked style="width:auto;vertical-align:middle"> この端末で30日間、合言葉を覚える</label>
  <button onclick="go()">表示する</button>
  <div id="err"></div>
</div>
<script>
// 「覚える」: 合言葉をこの端末のブラウザ（localStorage）に期限つきで保存し、次からは自動で開く。
// ページは公開のたびに暗号化し直す（salt が変わる）ので、鍵ではなく合言葉そのものを保存する。
// 共用のPC・スマホでは「覚える」を外すか、開いたページ右下の「合言葉を忘れる」を押す。
const STORE='kokkai-clip-pw', DAYS=30;
const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const G=document.getElementById('gate');
const FORGET='<button onclick="localStorage.removeItem(\''+STORE+'\');location.reload()" '
  +'style="position:fixed;right:10px;bottom:10px;padding:5px 10px;font-size:12px;background:#e6ebf0;color:#33414f;'
  +'border:0;border-radius:6px;cursor:pointer;opacity:.85">🔓 合言葉を忘れる</button>';
async function go(auto){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  err.textContent='復号中…';
  try{
    const enc=new TextEncoder();
    const salt=b2u(G.dataset.salt), iv=b2u(G.dataset.iv), ct=b2u(G.dataset.ct);
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:parseInt(G.dataset.iter),hash:'SHA-256'},
                 km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    let html=new TextDecoder().decode(pt);
    if(!auto){
      if(document.getElementById('remember').checked)
        localStorage.setItem(STORE, JSON.stringify({pw, exp: Date.now()+DAYS*864e5}));
      else localStorage.removeItem(STORE);
    }
    if(localStorage.getItem(STORE)) html = html.includes('</body>') ? html.replace('</body>', FORGET+'</body>') : html+FORGET;
    document.open();document.write(html);document.close();
  }catch(e){
    if(auto){ localStorage.removeItem(STORE); document.getElementById('pw').value='';
              err.textContent='合言葉が変わったようです。もう一度入力してください'; }
    else err.textContent='合言葉が違います';
  }
}
// 覚えている合言葉が期限内なら自動で開く
try{
  const r=JSON.parse(localStorage.getItem(STORE)||'null');
  if(r && r.exp>Date.now() && r.pw){ document.getElementById('pw').value=r.pw; go(true); }
  else if(r) localStorage.removeItem(STORE);
}catch(e){ localStorage.removeItem(STORE); }
</script></body></html>
